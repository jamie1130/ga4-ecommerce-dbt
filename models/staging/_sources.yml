version: 2

sources:
  - name: ga4
    description: >
      Google Merchandise Store GA4 export (obfuscated public sample, Nov 2020 to Jan 2021).
      One sharded table per day: events_YYYYMMDD.
    database: bigquery-public-data
    schema: ga4_obfuscated_sample_ecommerce
    tables:
      - name: events
        identifier: "events_*"
        description: Raw GA4 events, one row per event, with nested event_params and items arrays.
