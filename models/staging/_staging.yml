version: 2

models:
  - name: stg_ga4__events
    description: One row per GA4 event with key event_params flattened into columns.
    columns:
      - name: event_key
        description: Surrogate key built from user, timestamp, event name, page and bundle sequence.
        data_tests: [not_null]
      - name: user_pseudo_id
        description: GA4 device/browser-level pseudonymous user ID.
        data_tests: [not_null]
      - name: session_key
        description: user_pseudo_id + ga_session_id. Null when GA4 did not record a session ID.
      - name: event_date
        data_tests: [not_null]
      - name: event_name
        data_tests: [not_null]
      - name: device_category
        data_tests:
          - accepted_values:
              arguments:
                values: ['desktop', 'mobile', 'tablet']
      - name: purchase_revenue_usd
        description: Revenue on purchase events (USD). Null on other events.

  - name: stg_ga4__items
    description: One row per item inside an ecommerce event.
    columns:
      - name: item_id
        data_tests: [not_null]
      - name: event_name
        data_tests: [not_null]
